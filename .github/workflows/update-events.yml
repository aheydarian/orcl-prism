name: Update events

# Refreshes events.json from the "Upcoming Events" list on the lab's UVA Engineering page.
# Twice a day at 10:37 and 22:37 UTC (3:37 am and 3:37 pm PDT; 6:37 am and 6:37 pm EDT),
# by hand from the Actions tab (Run workflow), and when this file or update_events.py changes.
on:
  schedule:
    - cron: '37 10,22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_events.py
      - .github/workflows/update-events.yml

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the HTML parser
        run: pip install beautifulsoup4==4.12.3

      - name: Read the lab page and rewrite events.json
        run: python update_events.py

      - name: Commit events.json if it changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- events.json; then
            git add events.json
            git commit -m 'Update events from the lab UVA page'
            git pull --rebase --quiet
            git push
          else
            echo 'No change in events.'
            # GitHub turns off scheduled workflows after 60 days without repository activity.
            last=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
              git commit --allow-empty -m 'Keep the scheduled events update active'
              git pull --rebase --quiet
              git push
            fi
          fi
