name: Update from the UVA site

# Keeps this copy in step with the lab's pages on the UVA Engineering site:
# - update_events.py: events.json from the "Upcoming Events" list on the lab's home page
# - update_projects.py: projects.json, the orb's project list in index.html and the
#   "Research projects" number, from the project cards on the lab's Research page
# Once a day at 11:37 UTC (4:37 am PDT / 7:37 am EDT; an hour earlier in winter),
# by hand from the Actions tab (Run workflow), and when the scripts or this file change.
on:
  schedule:
    - cron: '37 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - uva_fetch.py
      - update_events.py
      - update_projects.py
      - .github/workflows/update-events.yml

permissions:
  contents: write

concurrency:
  group: update-from-uva
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the HTML parser
        run: pip install beautifulsoup4==4.12.3

      - name: Events from the lab's home page
        run: python update_events.py

      - name: Projects from the lab's Research page
        run: python update_projects.py

      - name: Commit what changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- events.json projects.json index.html; then
            git add events.json projects.json index.html
            git commit -m 'Update events and projects from the lab UVA pages'
            git pull --rebase --quiet
            git push
          else
            echo 'Nothing changed.'
            # GitHub turns off scheduled workflows after 60 days without repository activity.
            last=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
              git commit --allow-empty -m 'Keep the scheduled update active'
              git pull --rebase --quiet
              git push
            fi
          fi
